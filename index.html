<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nesP3 Liquid Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes liveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b, #0369a1);
            background-size: 300% 300%;
            animation: liveGradient 18s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .album-cover-container {
            width: 100%;
            height: 180px;
            background: rgba(2, 6, 23, 0.6);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #albumCover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .cover-stub {
            font-size: 2.5rem;
            color: #475569;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .cover-stub span {
            font-size: 0.75rem;
            color: #64748b;
        }

        .track-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .track-info {
            min-width: 0;
            flex: 1;
        }

        .track-info h3 {
            font-size: 0.95rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .track-info p {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .like-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .like-btn:active {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ctrl-btn:active {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
        }

        .ctrl-btn.main {
            background: linear-gradient(135deg, #3b82f6, #0284c7);
            color: #fff;
            width: 50px;
            height: 50px;
            font-size: 1.1rem;
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .upload-group {
            display: flex;
        }

        .upload-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            color: #38bdf8;
            border: 1px dashed rgba(56, 189, 248, 0.4);
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .albums-section {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .albums-section::-webkit-scrollbar {
            display: none;
        }

        .album-pill {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .album-pill.active {
            background: rgba(59, 130, 246, 0.3);
            color: #fff;
            border-color: rgba(59, 130, 246, 0.6);
            font-weight: 600;
        }

        .add-album-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .right-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs {
            display: flex;
            background: rgba(2, 6, 23, 0.4);
            padding: 2px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tab {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .brand {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 600;
        }

        .search-box {
            width: 100%;
            background: rgba(2, 6, 23, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .content-area {
            flex: 1;
            height: 200px;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 2px;
        }

        #playlist {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #playlist li {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            gap: 6px;
        }

        #playlist li.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .track-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e2e8f0;
        }

        #lyricsView {
            background: rgba(2, 6, 23, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.6;
            height: 100%;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .lyric-line {
            transition: all 0.3s ease;
            padding: 4px 0;
            cursor: pointer;
        }

        .lyric-line.active {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        #fileInput {
            display: none;
        }

        /* Медиазапрос для ПК (экраны шире 768px): возвращаем полноценный Grid в две колонки */
        @media (min-width: 769px) {
            body {
                padding: 20px;
            }
            .app-container {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 20px;
                max-width: 1000px;
            }
            .glass-panel {
                padding: 24px;
                gap: 20px;
                border-radius: 24px;
            }
            .album-cover-container {
                height: 260px;
                border-radius: 16px;
            }
            .cover-stub {
                font-size: 3.5rem;
            }
            .track-info h3 {
                font-size: 1.05rem;
            }
            .track-info p {
                font-size: 0.82rem;
            }
            .ctrl-btn {
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }
            .ctrl-btn.main {
                width: 56px;
                height: 56px;
                font-size: 1.3rem;
            }
            .upload-btn {
                padding: 10px;
                border-radius: 14px;
                font-size: 0.8rem;
            }
            .album-pill {
                padding: 7px 14px;
                border-radius: 12px;
                font-size: 0.8rem;
            }
            .add-album-btn {
                padding: 7px 12px;
                border-radius: 12px;
                font-size: 0.8rem;
            }
            .search-box {
                padding: 12px 16px;
                border-radius: 12px;
                font-size: 0.9rem;
            }
            .content-area {
                height: 280px;
                max-height: 310px;
            }
            #playlist li {
                padding: 12px 14px;
                border-radius: 12px;
                font-size: 0.9rem;
            }
            #lyricsView {
                padding: 16px;
                border-radius: 14px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Левая панель -->
        <div class="glass-panel">
            <div class="album-cover-container">
                <img id="albumCover" alt="Обложка">
                <div id="coverStub" class="cover-stub">🎵<span>nesP3</span></div>
            </div>

            <div class="track-meta">
                <div class="track-info">
                    <h3 id="trackTitle">Трек не выбран</h3>
                    <p id="trackArtist">Liquid Player</p>
                </div>
                <button class="like-btn">♡</button>
            </div>

            <div class="audio-controls">
                <button id="prevBtn" class="ctrl-btn">⏮</button>
                <button id="playBtn" class="ctrl-btn main">▶</button>
                <button id="nextBtn" class="ctrl-btn">⏭</button>
            </div>

            <div class="upload-group">
                <label for="fileInput" class="upload-btn">+ Локальные MP3</label>
            </div>
            <input type="file" id="fileInput" accept="audio/*, video/mp4" multiple>
        </div>

        <!-- Правая панель -->
        <div class="glass-panel">
            <div class="albums-section" id="albumsContainer"></div>

            <div class="right-header">
                <div class="tabs">
                    <button id="tabTracks" class="tab active">Треки</button>
                    <button id="tabLyrics" class="tab">Текст</button>
                </div>
                <span class="brand">nesP3 LIQUID</span>
            </div>

            <input type="text" id="searchInput" class="search-box" placeholder="Поиск по плейлисту...">

            <div class="content-area">
                <ul id="playlist"></ul>
                <div id="lyricsView">Текст песни появится здесь...</div>
            </div>
        </div>
    </div>

    <audio id="mediaPlayer"></audio>

    <script>
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const fileInput = document.getElementById('fileInput');
        const playlistEl = document.getElementById('playlist');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const searchInput = document.getElementById('searchInput');
        const tabTracks = document.getElementById('tabTracks');
        const tabLyrics = document.getElementById('tabLyrics');
        const lyricsView = document.getElementById('lyricsView');
        const albumCover = document.getElementById('albumCover');
        const coverStub = document.getElementById('coverStub');
        const albumsContainer = document.getElementById('albumsContainer');

        let db = null;
        let albums = [];
        let currentAlbumId = null;
        let tracks = [];
        let currentIndex = 0;
        let currentView = 'tracks'; 
        let lyricsCache = {};
        let parsedLyrics = [];

        const request = indexedDB.open('NesP3LiquidDB', 6);
        request.onerror = (e) => console.error("Ошибка БД", e);
        request.onsuccess = (e) => {
            db = e.target.result;
            loadAlbums();
        };
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('albums')) {
                db.createObjectStore('albums', { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains('tracks')) {
                const store = db.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
                store.createIndex('albumId', 'albumId', { unique: false });
            }
        };

        function loadAlbums() {
            const tx = db.transaction(['albums'], 'readonly');
            const store = tx.objectStore('albums');
            const req = store.getAll();

            req.onsuccess = () => {
                albums = req.result;
                if (albums.length === 0) {
                    createDefaultAlbum(() => loadAlbums());
                } else {
                    if (!currentAlbumId) currentAlbumId = albums[0].id;
                    renderAlbums();
                    loadTracksForAlbum(currentAlbumId);
                }
            };
        }

        function createDefaultAlbum(cb) {
            const tx = db.transaction(['albums'], 'readwrite');
            const store = tx.objectStore('albums');
            const req = store.add({ name: 'Моя музыка' });
            req.onsuccess = () => { if (cb) cb(); };
        }

        function renderAlbums() {
            albumsContainer.innerHTML = '';
            albums.forEach(album => {
                const btn = document.createElement('button');
                btn.className = `album-pill ${album.id === currentAlbumId ? 'active' : ''}`;
                btn.textContent = album.name;
                btn.addEventListener('click', () => {
                    currentAlbumId = album.id;
                    renderAlbums();
                    loadTracksForAlbum(currentAlbumId);
                });
                albumsContainer.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-album-btn';
            addBtn.textContent = '+ Альбом';
            addBtn.addEventListener('click', () => {
                const name = prompt('Название нового альбома:');
                if (name && name.trim() !== '') {
                    addNewAlbum(name.trim());
                }
            });
            albumsContainer.appendChild(addBtn);
        }

        function addNewAlbum(name) {
            const tx = db.transaction(['albums'], 'readwrite');
            const store = tx.objectStore('albums');
            const req = store.add({ name });
            req.onsuccess = (e) => {
                currentAlbumId = e.target.result;
                loadAlbums();
            };
        }

        function loadTracksForAlbum(albumId) {
            const tx = db.transaction(['tracks'], 'readonly');
            const store = tx.objectStore('tracks');
            const index = store.index('albumId');
            const req = index.getAll(albumId);

            req.onsuccess = () => {
                tracks = req.result;
                if (currentView === 'tracks') {
                    renderPlaylist();
                }
                if (tracks.length > 0 && currentView === 'tracks') {
                    selectTrack(0, false);
                } else if (tracks.length === 0 && currentView === 'tracks') {
                    trackTitle.textContent = 'Альбом пуст';
                    trackArtist.textContent = 'Загрузите локальные треки';
                    albumCover.style.display = 'none';
                    coverStub.style.display = 'flex';
                }
            };
        }

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0 || !currentAlbumId) return;

            const tx = db.transaction(['tracks'], 'readwrite');
            const store = tx.objectStore('tracks');

            files.forEach(file => {
                store.add({ albumId: currentAlbumId, name: file.name, type: 'local', blob: file });
            });

            tx.oncomplete = () => loadTracksForAlbum(currentAlbumId);
        });

        function switchView(view) {
            currentView = view;
            tabTracks.classList.toggle('active', view === 'tracks');
            tabLyrics.classList.toggle('active', view === 'lyrics');

            playlistEl.style.display = (view === 'lyrics') ? 'none' : 'flex';
            searchInput.style.display = (view === 'lyrics') ? 'none' : 'block';
            lyricsView.style.display = (view === 'lyrics') ? 'flex' : 'none';

            if (view === 'tracks') {
                searchInput.placeholder = "Поиск по плейлисту...";
                renderPlaylist(searchInput.value);
            } else if (view === 'lyrics') {
                fetchLyricsNet();
            }
        }

        tabTracks.addEventListener('click', () => switchView('tracks'));
        tabLyrics.addEventListener('click', () => switchView('lyrics'));

        searchInput.addEventListener('input', (e) => {
            if (currentView === 'tracks') {
                renderPlaylist(e.target.value);
            }
        });

        function renderPlaylist(filter = '') {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                if (!track.name.toLowerCase().includes(filter.toLowerCase())) return;

                const li = document.createElement('li');
                if (index === currentIndex && currentView === 'tracks') li.classList.add('active');

                li.innerHTML = `
                    <span class="track-item-title">${index + 1}. ${track.name}</span>
                    <span style="font-size:0.65rem; color:#38bdf8; flex-shrink:0;">MP3</span>
                `;
                li.addEventListener('click', () => {
                    if (currentView !== 'tracks') switchView('tracks');
                    selectTrack(index, true);
                });
                playlistEl.appendChild(li);
            });
        }

        async function fetchLyricsNet() {
            if (tracks.length === 0 && currentView === 'lyrics') {
                lyricsView.textContent = "Нет трека для поиска текста.";
                return;
            }
            const track = tracks[currentIndex];
            if (!track) return;
            let cleanTitle = track.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").trim();

            if (lyricsCache[track.id]) {
                renderLyricsLines(lyricsCache[track.id]);
                return;
            }

            lyricsView.innerHTML = "<div style='margin:auto; color:#94a3b8;'>Загрузка текста...</div>";

            try {
                const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const songData = data.find(item => item.syncedLyrics) || data[0];
                    const textContent = songData.syncedLyrics || songData.plainLyrics;
                    
                    lyricsCache[track.id] = textContent;
                    renderLyricsLines(textContent);
                } else {
                    lyricsView.innerHTML = `<div style='margin:auto; color:#94a3b8;'>Текст для трека не найден.</div>`;
                }
            } catch (err) {
                lyricsView.innerHTML = "<div style='margin:auto; color:#ef4444;'>Ошибка сети при загрузке текста.</div>";
            }
        }

        function renderLyricsLines(rawText) {
            lyricsView.innerHTML = '';
            parsedLyrics = [];

            const lines = rawText.split('\n');
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            let hasTimestamps = false;

            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    hasTimestamps = true;
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    const millis = parseInt(match[3].padEnd(3, '0'), 10);
                    const timeInSeconds = minutes * 60 + seconds + millis / 1000;
                    const text = line.replace(timeReg, '').trim();

                    if (text) parsedLyrics.push({ time: timeInSeconds, text });
                }
            });

            if (hasTimestamps && parsedLyrics.length > 0) {
                parsedLyrics.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.dataset.index = idx;
                    div.textContent = item.text;
                    div.addEventListener('click', () => { mediaPlayer.currentTime = item.time; });
                    lyricsView.appendChild(div);
                });
            } else {
                const div = document.createElement('div');
                div.style.whiteSpace = 'pre-wrap';
                div.style.color = '#cbd5e1';
                div.textContent = rawText;
                lyricsView.appendChild(div);
                parsedLyrics = [];
            }
        }

        mediaPlayer.addEventListener('timeupdate', () => {
            if (currentView !== 'lyrics' || parsedLyrics.length === 0) return;
            const currentTime = mediaPlayer.currentTime;
            let activeIndex = -1;

            for (let i = 0; i < parsedLyrics.length; i++) {
                if (parsedLyrics[i].time <= currentTime) activeIndex = i;
                else break;
            }

            const lineElements = lyricsView.querySelectorAll('.lyric-line');
            lineElements.forEach((el, idx) => {
                if (idx === activeIndex) {
                    if (!el.classList.contains('active')) {
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    el.classList.remove('active');
                }
            });
        });

        async function selectTrack(index, play = true) {
            if (index < 0 || index >= tracks.length) return;
            currentIndex = index;
            const track = tracks[currentIndex];

            trackTitle.textContent = track.name.replace(/\.[^/.]+$/, "");

            if (track.type === 'local' && track.blob) {
                mediaPlayer.src = URL.createObjectURL(track.blob);
                trackArtist.textContent = 'Локальный файл';
                albumCover.style.display = 'none';
                coverStub.style.display = 'flex';
                extractCoverAndTags(track);
                
                if (play) {
                    mediaPlayer.play();
                    playBtn.textContent = '⏸';
                }
            }

            if (currentView === 'tracks') renderPlaylist(searchInput.value);
            if (currentView === 'lyrics') fetchLyricsNet();
        }

        function extractCoverAndTags(track) {
            if (!track.blob) return;
            if (window.jsmediatags) {
                window.jsmediatags.read(track.blob, {
                    onSuccess: (tag) => {
                        const picture = tag.tags.picture;
                        if (picture) {
                            let base64String = "";
                            for (let i = 0; i < picture.data.length; i++) {
                                base64String += String.fromCharCode(picture.data[i]);
                            }
                            albumCover.src = `data:${picture.format};base64,${window.btoa(base64String)}`;
                            albumCover.style.display = 'block';
                            coverStub.style.display = 'none';
                        }
                    }
                });
            }
        }

        playBtn.addEventListener('click', () => {
            if (tracks.length === 0 || !mediaPlayer.src) return;
            if (mediaPlayer.paused) {
                mediaPlayer.play().then(() => { playBtn.textContent = '⏸'; }).catch(e => console.log(e));
            } else {
                mediaPlayer.pause();
                playBtn.textContent = '▶';
            }
        });

        mediaPlayer.addEventListener('play', () => playBtn.textContent = '⏸');
        mediaPlayer.addEventListener('pause', () => playBtn.textContent = '▶');
        
        nextBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            let nextIndex = (currentIndex + 1) % tracks.length;
            selectTrack(nextIndex, true);
        });

        prevBtn.addEventListener('click', () => {
            if (tracks.length === 0) return;
            let prevIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            selectTrack(prevIndex, true);
        });

        mediaPlayer.addEventListener('ended', () => {
            let nextIndex = (currentIndex + 1) % tracks.length;
            selectTrack(nextIndex, true);
        });
    </script>
</body>
</html>
